# Unbeaufsichtigte Debian-12-Installation für ein KAI-Kiosk-NUC-Terminal.
# ⚠️ LÖSCHT DIE ERSTE FESTPLATTE DES GERÄTS VOLLSTÄNDIG und installiert Debian darauf.
#    Vor dem Einsatz auf Produktiv-Hardware zuerst auf einer Test-NUC verifizieren.

### Sprache / Tastatur / Land
d-i debian-installer/language string de
d-i debian-installer/country string DE
d-i debian-installer/locale string de_DE.UTF-8
d-i keyboard-configuration/xkb-keymap select de

### Netzwerk (DHCP), Hostname
# IMMER das kabelgebundene Interface (en*/eth*) nehmen, NIE WLAN — sonst verlangt der Installer eine
# WLAN-Passphrase und bleibt hängen. Ein LAN-Kabel ist beim Installieren Pflicht (netinst braucht Netz).
d-i preseed/early_command string IFACE=$(ls /sys/class/net/ 2>/dev/null | grep -E '^(en|eth)' | grep -v '^wl' | head -n1); if [ -n "$IFACE" ]; then debconf-set netcfg/choose_interface "$IFACE"; fi
d-i netcfg/choose_interface select auto
d-i netcfg/disable_autoconfig boolean false
d-i netcfg/dhcp_timeout string 60
d-i netcfg/link_wait_timeout string 30
# Keine WLAN-Abfrage: falls doch kein Kabel, lieber DHCP-Fehler als Passphrase-Dialog.
d-i netcfg/wireless_show_essids select manual
d-i netcfg/get_hostname string kai-kiosk
d-i netcfg/get_domain string local
d-i netcfg/hostname string kai-kiosk

### Paketquellen
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

### Konten: root gesperrt, Benutzer 'pi' mit sudo (einheitlich mit den Raspi-Images)
d-i passwd/root-login boolean false
d-i passwd/user-fullname string KAI Kiosk
d-i passwd/username string pi
d-i passwd/user-password password kai-terminal
d-i passwd/user-password-again password kai-terminal
d-i user-setup/allow-password-weak boolean true
d-i passwd/user-default-groups string audio cdrom video sudo netdev

### Uhr / Zeitzone
d-i clock-setup/utc boolean true
d-i time/zone string Europe/Berlin
d-i clock-setup/ntp boolean true

### Partitionierung — erste erkannte Platte, alles auf eine Partition, geführt.
# Die Zielplatte wird dynamisch ermittelt (NUC kann /dev/sda ODER /dev/nvme0n1 sein).
d-i partman/early_command string \
  DISK=$(list-devices disk | head -n1); \
  debconf-set partman-auto/disk "$DISK"; \
  debconf-set grub-installer/bootdev "$DISK"
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

### Basissystem / Pakete
d-i apt-setup/non-free boolean true
d-i apt-setup/non-free-firmware boolean true
tasksel tasksel/first multiselect ssh-server
d-i pkgsel/include string openssh-server xserver-xorg xinit openbox lightdm chromium chromium-l10n x11vnc unclutter network-manager sudo curl ca-certificates python3 plymouth plymouth-themes feh
d-i pkgsel/upgrade select safe-upgrade
popularity-contest popularity-contest/participate boolean false

### GRUB (UEFI + BIOS)
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true

### Fertig: nicht nachfragen, direkt neu starten
d-i finish-install/reboot_in_progress note

### Kiosk einrichten: Dateien vom Installationsmedium ins Zielsystem kopieren und einrichten.
d-i preseed/late_command string \
  cp -a /cdrom/kai-kiosk /target/opt/kai-kiosk-setup; \
  in-target bash /opt/kai-kiosk-setup/kiosk-setup.sh; \
  in-target rm -rf /opt/kai-kiosk-setup
