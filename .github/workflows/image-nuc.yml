name: image-nuc

# EXPERIMENTELL. Baut einen unbeaufsichtigten Debian-12-Autoinstall-USB (ISO) für Intel-NUCs (x86/amd64):
# nimmt das offizielle Debian-netinst-ISO, legt preseed.cfg + unsere Kiosk-Dateien hinein und setzt das
# Boot-Menü auf eine vollautomatische Installation. Der NUC bootet vom USB, installiert sich selbst auf
# die interne Platte und wird zum KAI-Terminal.
#
# ⚠️ Das ISO LÖSCHT die erste Festplatte des NUC. Vor dem Einsatz auf Produktiv-Hardware ZWINGEND auf
#    einer Test-NUC verifizieren. Der risikoarme Alternativweg ist install-nuc.sh (s. README).
#
# Auslösen: manuell (Actions → image-nuc → Run) oder per Tag `nuc-*` (dann Release mit `.iso`).

on:
  workflow_dispatch:
  push:
    tags: ["nuc-*"]

permissions:
  contents: write

jobs:
  image-nuc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: KAI-Kiosk-Binary (amd64) bauen
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o kai-kiosk .

      - name: Werkzeuge
        run: sudo apt-get update && sudo apt-get install -y xorriso

      - name: Debian-netinst-ISO laden (aktuelles Point-Release)
        run: |
          set -euxo pipefail
          BASE=https://cdimage.debian.org/debian-cd/current/amd64/iso-cd/
          ISO=$(curl -fsSL "$BASE" | grep -oE 'debian-[0-9.]+-amd64-netinst\.iso' | head -n1)
          test -n "$ISO"
          curl -fL --retry 3 -o debian.iso "${BASE}${ISO}"
          ls -lh debian.iso

      - name: ISO entpacken
        run: |
          set -euxo pipefail
          mkdir -p isoroot
          xorriso -osirrox on -indev debian.iso -extract / isoroot
          chmod -R u+w isoroot

      - name: Kiosk-Dateien + preseed einlegen
        run: |
          set -euxo pipefail
          mkdir -p isoroot/kai-kiosk
          cp kai-kiosk                       isoroot/kai-kiosk/kai-kiosk
          cp kiosk-browser.sh                isoroot/kai-kiosk/kiosk-browser.sh
          cp systemd/kai-kiosk.service       isoroot/kai-kiosk/kai-kiosk.service
          cp config.example.json            isoroot/kai-kiosk/config.json
          cp nuc/kiosk-setup.sh              isoroot/kai-kiosk/kiosk-setup.sh
          cp nuc/preseed.cfg                 isoroot/preseed.cfg

          # BIOS-Boot-Menü (isolinux): vollautomatisch starten.
          cat > isoroot/isolinux/txt.cfg <<'EOF'
          default kai
          label kai
            menu label ^KAI-Kiosk unbeaufsichtigt installieren
            kernel /install.amd/vmlinuz
            append auto=true priority=critical preseed/file=/cdrom/preseed.cfg initrd=/install.amd/initrd.gz vga=788 ---
          EOF
          sed -i 's/^timeout .*/timeout 30/' isoroot/isolinux/isolinux.cfg || true

          # UEFI-Boot-Menü (grub): vollautomatisch starten (NUCs booten UEFI).
          cat > isoroot/boot/grub/grub.cfg <<'EOF'
          set default=0
          set timeout=5
          menuentry "KAI-Kiosk unbeaufsichtigt installieren (NUC)" {
            linux  /install.amd/vmlinuz auto=true priority=critical preseed/file=/cdrom/preseed.cfg vga=788 ---
            initrd /install.amd/initrd.gz
          }
          EOF

          # md5sum.txt aktualisieren (sonst meckert der Installer über veränderte Dateien).
          if [ -f isoroot/md5sum.txt ]; then
            ( cd isoroot && find . -type f ! -name md5sum.txt -exec md5sum {} \; > md5sum.txt )
          fi

      - name: ISO neu packen (UEFI + BIOS bootfähig)
        id: pack
        run: |
          set -euxo pipefail
          OUT="kai-kiosk-nuc-$(date +%Y-%m-%d).iso"
          # Boot-Struktur exakt aus dem Original-ISO übernehmen (El-Torito-Report → mkisofs-Optionen).
          xorriso -indev debian.iso -report_el_torito as_mkisofs 2>/dev/null > mkargs.txt
          cat mkargs.txt
          # Die gemeldeten Optionen enthalten Volume-Namen mit Leerzeichen → über eval mit Quoting.
          eval xorriso -as mkisofs \
            $(sed -e 's/^-V .*/-V KAI-KIOSK-NUC/' mkargs.txt | tr '\n' ' ') \
            -o "$OUT" isoroot
          ls -lh "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"

      - name: ISO als Artefakt
        uses: actions/upload-artifact@v4
        with:
          name: kai-kiosk-nuc-iso
          path: ${{ steps.pack.outputs.path }}
          if-no-files-found: error

      - name: Release (bei Tag nuc-*)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.pack.outputs.path }}
